<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Music | Square Player</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-wrapper">
        <!-- Background Shader Elements -->
        <div class="bg-shader">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>
        <div class="bg-noise"></div>

        <main class="player-box">

            <header class="player-header reveal-anim">
                <h1 class="title"><span class="italic">FAV</span> MUSIC.</h1>

                <!-- Genre Tabs -->
                <nav class="genres" role="tablist" aria-label="Music genres">
                    <button class="genre-btn active" data-genre="all" role="tab" aria-selected="true">All</button>
                    <button class="genre-btn" data-genre="bollywood" role="tab" aria-selected="false">Bollywood</button>
                    <button class="genre-btn" data-genre="pop" role="tab" aria-selected="false">Pop</button>
                    <button class="genre-btn" data-genre="acoustic" role="tab" aria-selected="false">Acoustic</button>
                </nav>
            </header>

            <!-- Track List -->
            <div class="track-list reveal-anim" id="track-list">
                <!-- Injected via JS -->
            </div>

            <!-- Player Controls -->
            <footer class="player-controls reveal-anim">
                <div class="now-playing-mini">
                    <div class="cover-wrapper">
                        <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=200&auto=format&fit=crop"
                            alt="Cover" id="current-cover">
                    </div>
                    <div class="np-info">
                        <h4 id="np-title">Sun Sawariya</h4>
                        <p id="np-artist">Unknown Artist</p>
                    </div>

                    <div class="player-actions">
                        <button class="control-btn" id="prev-btn" aria-label="Previous track">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5"
                                fill="none">
                                <polygon points="19 20 9 12 19 4 19 20"></polygon>
                                <line x1="5" y1="19" x2="5" y2="5"></line>
                            </svg>
                        </button>
                        <button class="control-btn play-pause-btn magnetic-btn" id="main-play-btn" aria-label="Play or pause">
                            <svg class="icon-play" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"
                                stroke-width="1.5" fill="currentColor">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                            <svg class="icon-pause" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"
                                stroke-width="1.5" fill="currentColor" style="display:none;">
                                <rect x="6" y="4" width="4" height="16"></rect>
                                <rect x="14" y="4" width="4" height="16"></rect>
                            </svg>
                        </button>
                        <button class="control-btn" id="next-btn" aria-label="Next track">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5"
                                fill="none">
                                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                                <line x1="19" y1="5" x2="19" y2="19"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="progress-wrapper">
                    <span class="time" id="current-time">0:00</span>
                    <div class="progress-bar" id="mini-progress-bar">
                        <div class="progress-fill" id="mini-progress-fill"></div>
                    </div>
                    <span class="time" id="total-time">0:00</span>
                </div>
            </footer>

            <!-- Expanded Player Overlay -->
            <div class="expanded-overlay" id="expanded-overlay">

                <button class="close-btn magnetic-btn" id="close-expanded" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5"
                        fill="none">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>

                <canvas id="vis-canvas"></canvas>

                <div class="expanded-content">
                    <div class="expanded-cover-container">
                        <img src="" alt="Cover" id="expanded-cover">
                    </div>

                    <div class="expanded-info">
                        <h2 id="expanded-title">Song Title</h2>
                        <p id="expanded-artist">Artist</p>
                    </div>

                    <div class="expanded-progress">
                        <span class="time" id="exp-current-time">0:00</span>
                        <div class="progress-bar" id="exp-progress-bar">
                            <div class="progress-fill" id="exp-progress-fill"></div>
                        </div>
                        <span class="time" id="exp-total-time">0:00</span>
                    </div>

                    <div class="expanded-controls-row">
                        <button class="control-btn magnetic-btn" id="exp-prev-btn" aria-label="Previous track">
                            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5"
                                fill="none">
                                <polygon points="19 20 9 12 19 4 19 20"></polygon>
                                <line x1="5" y1="19" x2="5" y2="5"></line>
                            </svg>
                        </button>
                        <button class="control-btn play-pause-btn magnetic-btn" id="exp-play-btn" aria-label="Play or pause">
                            <svg class="icon-play exp-icon-play" viewBox="0 0 24 24" width="24" height="24"
                                stroke="currentColor" stroke-width="1.5" fill="currentColor">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                            <svg class="icon-pause exp-icon-pause" viewBox="0 0 24 24" width="24" height="24"
                                stroke="currentColor" stroke-width="1.5" fill="currentColor" style="display:none;">
                                <rect x="6" y="4" width="4" height="16"></rect>
                                <rect x="14" y="4" width="4" height="16"></rect>
                            </svg>
                        </button>
                        <button class="control-btn magnetic-btn" id="exp-next-btn" aria-label="Next track">
                            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5"
                                fill="none">
                                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                                <line x1="19" y1="5" x2="19" y2="19"></line>
                            </svg>
                        </button>
                    </div>

                    <!-- Visualizer Mode Selector placed below the controls -->
                    <div class="vis-selector" role="group" aria-label="Visualizer mode">
                        <button class="vis-mode-btn active" data-mode="bars" aria-label="Bars visualizer">Bars</button>
                        <button class="vis-mode-btn" data-mode="wave" aria-label="Wave visualizer">Wave</button>
                        <button class="vis-mode-btn" data-mode="aura" aria-label="Aura visualizer">Aura</button>
                    </div>
                </div>
            </div>

        </main>

        <div class="bottom-text reveal-anim">
            this website is created just for aditya's timepass. NO thing here
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
